# The four gates from docs/cicd.md, run on every push and pull request.
# No secrets: the Python suites stub DeepSeek, and compose is only validated,
# never started. Deploys are Coolify's job, triggered by its own GitHub app on
# pushes to main — see docs/deploy.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  python:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [python-analyzer, ai-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every secret is required by the file, so validation needs placeholders.
      # Values are never used — nothing is started.
      - run: docker compose --profile edge config -q
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          GATEWAY_SECRET: ci
          BETTER_AUTH_SECRET: ci
          DEEPSEEK_API_KEY: ci
