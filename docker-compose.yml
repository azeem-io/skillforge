# The whole system, and the same file in local dev and in production. The
# frontend publishes 3000 and Caddy (edge profile) publishes 80/443; everything
# else is reachable on the compose network and nowhere else.
#
# Secrets come from a .env file beside this one, which is gitignored;
# .env.example lists every key. Nothing here has a usable default for a
# credential — an unset variable fails the container rather than silently
# starting with a well-known password.
#
# python-analyzer and ai-service are the two Python services. ai-service is the
# slowest to start: it embeds the knowledge base at boot so the first question
# does not pay for it, which is why its start_period is generous.

name: skillforge

services:
  postgres:
    # pgvector, not plain postgres: the ai-service stores embeddings here.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Deliberately no `ports:`. Publishing 5432 on a VPS exposes the database to
    # the internet, and a firewall rule is a second thing to get right when
    # simply not publishing the port is the first.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Runs to completion before anything else starts, and exits. `restart: "no"`
  # is load-bearing: a restart policy on a one-shot job turns a failed migration
  # into a crash loop that never surfaces as a failed deploy.
  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    image: ${IMAGE_PREFIX:-skillforge}/migrate:${IMAGE_TAG:-local}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SEED_ON_START: ${SEED_ON_START:-true}

  auth-service:
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
    image: ${IMAGE_PREFIX:-skillforge}/auth-service:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Addressed by service name, not localhost — the containers share a
      # network, not a loopback interface.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      # The origin the browser sees, which is Caddy's.
      BETTER_AUTH_URL: https://${SITE_ADDRESS:-localhost}
      # http://localhost:3000 is trusted alongside the Caddy address because the
      # frontend port is published for testing without the self-signed
      # certificate; Better Auth rejects any origin not named here.
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000}
      # Declared in .env.example but never forwarded, so a Secure-only cookie
      # was issued and http://localhost:3000 could sign in but not stay signed
      # in. Set false behind real TLS.
      AUTH_INSECURE_COOKIES: ${AUTH_INSECURE_COOKIES:-true}
      # Caddy and the gateway are the only hops in front of this container, so
      # they are the only ones allowed to set X-Forwarded-For. Without naming
      # them, Better Auth cannot tell which hop is real and collapses every
      # client into one rate-limit bucket. This is the compose network's default
      # subnet; override in .env if you have changed it.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      # Sign-in throttling. Defaults are set in auth.ts and are deliberately
      # loose while every client still shares the `no-trusted-ip` bucket.
      AUTH_RATE_WINDOW: ${AUTH_RATE_WINDOW:-60}
      AUTH_RATE_MAX: ${AUTH_RATE_MAX:-120}
      AUTH_SIGNIN_WINDOW: ${AUTH_SIGNIN_WINDOW:-300}
      AUTH_SIGNIN_MAX: ${AUTH_SIGNIN_MAX:-30}
      AUTH_SIGNUP_WINDOW: ${AUTH_SIGNUP_WINDOW:-900}
      AUTH_SIGNUP_MAX: ${AUTH_SIGNUP_MAX:-20}
      PORT: 8081
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://localhost:8081/health')).ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  profile-api:
    build:
      context: .
      dockerfile: backend/profile-api/Dockerfile
    image: ${IMAGE_PREFIX:-skillforge}/profile-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      UPLOAD_DIR: /data/uploads
      PORT: 8082
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://localhost:8082/health')).ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  skill-service:
    build:
      context: .
      dockerfile: backend/skill-service/Dockerfile
    image: ${IMAGE_PREFIX:-skillforge}/skill-service:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      PYTHON_ANALYZER_URL: http://python-analyzer:8085
      PORT: 8083
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://localhost:8083/health')).ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  python-analyzer:
    build:
      context: .
      dockerfile: python-analyzer/Dockerfile
    image: ${IMAGE_PREFIX:-skillforge}/python-analyzer:${IMAGE_TAG:-local}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8085/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    image: ${IMAGE_PREFIX:-skillforge}/ai-service:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      python-analyzer:
        condition: service_healthy
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      PYTHON_ANALYZER_URL: http://python-analyzer:8085
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8084/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Embedding the corpus at boot takes about 15s on a warm image.
      start_period: 60s

  api-gateway:
    build:
      context: .
      dockerfile: backend/api-gateway/Dockerfile
    image: ${IMAGE_PREFIX:-skillforge}/api-gateway:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      profile-api:
        condition: service_healthy
      skill-service:
        condition: service_healthy
    environment:
      # No DATABASE_URL on purpose: the gateway routes and verifies, and a
      # router holding database credentials is a router that will eventually
      # start querying.
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      AUTH_SERVICE_URL: http://auth-service:8081
      PROFILE_API_URL: http://profile-api:8082
      SKILL_SERVICE_URL: http://skill-service:8083
      AI_SERVICE_URL: http://ai-service:8084
      PYTHON_ANALYZER_URL: http://python-analyzer:8085
      PORT: 8080
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://localhost:8080/health')).ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ${IMAGE_PREFIX:-skillforge}/frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    # Published on loopback only: http://localhost:3000 works for local dev,
    # but on a VPS the raw IP must not serve an unencrypted copy of the app.
    # Docker publishes straight past ufw, so the binding is the firewall.
    # Coolify's proxy reaches the container over the compose network instead.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      # Server Components fetch through the gateway by service name. Caddy
      # answers the browser's /api/* requests before they reach Next, so the
      # rewrite in next.config.ts is only exercised in local dev.
      GATEWAY_URL: http://api-gateway:8080
      # frontend/lib/db.ts still reads a few pages directly; those reads move
      # behind skill-service as the graph views are wired up.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # app/api/ai/* proxies the wand and the assistant straight to ai-service;
      # without this it defaults to localhost and finds nothing in a container.
      AI_SERVICE_URL: http://ai-service:8084
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/dashboard').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    # Opt-in edge. Coolify brings its own proxy that already owns 80/443 on the
    # VPS, so Caddy only runs where nothing else terminates TLS:
    #   docker compose --profile edge up -d
    profiles: ["edge"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - api-gateway
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 — the same port number as 443/tcp but a different protocol, so
      # it needs its own mapping.
      - "443:443/udp"
    environment:
      # `localhost` is a real value, not a placeholder: for localhost and IP
      # addresses Caddy issues from its own internal CA instead of going to
      # Let's Encrypt, so a clean clone gets working HTTPS with no DNS and no
      # internet. Point it at a domain for a real deploy.
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Losing this volume means re-issuing
      # on every restart, which hits Let's Encrypt rate limits fast.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  uploads:
  caddy-data:
  caddy-config:
